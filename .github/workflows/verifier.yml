# Verification a chaque poussee : typage, bundle, tests, et fabrication des
# trois livrables. Le resultat est depose en artefact, ce qui permet de
# telecharger le fichier a envoyer aux entraineurs sans rien installer.
name: Verifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Le build pilote un vrai navigateur pour les captures d'ecran de la
      # prise en main, et les tests de fumee en ouvrent un aussi.
      # On le localise ici plutot que de le deviner : l'image du runner peut
      # changer, la variable, elle, sera toujours lue.
      - name: Localiser le navigateur
        run: |
          for chemin in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium-browser \
            /usr/bin/chromium \
            /snap/bin/chromium
          do
            if [ -x "$chemin" ]; then
              echo "CHROME_PATH=$chemin" >> "$GITHUB_ENV"
              echo "Navigateur retenu : $chemin"
              "$chemin" --version || true
              exit 0
            fi
          done
          echo "::error::Aucun navigateur trouve sur le runner."
          echo "Les captures de la prise en main en ont besoin."
          exit 1

      - run: npm ci

      - name: Verifier (typage, bundle, livrables, tests)
        run: npm run verifier

      - name: Controler que les trois livrables sont la
        run: |
          manquant=0
          for f in dist/HBPSM-entrainements.html dist/PRISE-EN-MAIN.html; do
            if [ -s "$f" ]; then
              echo "$f  $(du -h "$f" | cut -f1)"
            else
              echo "::error::$f absent ou vide"
              manquant=1
            fi
          done
          exit $manquant

      - uses: actions/upload-artifact@v4
        with:
          name: livrables
          path: |
            dist/HBPSM-entrainements.html
            dist/PRISE-EN-MAIN.html
          if-no-files-found: error
          retention-days: 30
