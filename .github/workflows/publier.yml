# Publication d'une version : sur une etiquette v1.2.3, ou a la demande.
#
# Les fichiers sont attaches a la Release GitHub. C'est ce lien qu'on envoie
# aux entraineurs : ils telechargent le livrable, double-cliquent, et c'est
# fini. Pas de compte, pas d'installation, pas de depot a cloner.
#
# Le nom du livrable vient du profil du club fabrique : rien ici ne le nomme.
name: Publier

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de la version, par exemple v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    # Le plafond est la pour tuer un blocage, pas pour borner un travail normal.
    # Il valait quinze minutes du temps ou un seul club etait fabrique ; chacun
    # coute environ trois minutes de machine — typage, bundle, notice avec ses
    # captures prises dans un vrai navigateur, tests et tests de fumee — et le
    # cache des captures ne se partage pas d'un club a l'autre, leurs livrables
    # etant differents. A revoir le jour ou le compte des clubs doublera encore.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Localiser le navigateur
        run: |
          for chemin in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium-browser \
            /usr/bin/chromium \
            /snap/bin/chromium
          do
            if [ -x "$chemin" ]; then
              echo "CHROME_PATH=$chemin" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Aucun navigateur trouve sur le runner."
          exit 1

      - run: npm ci

      # On ne publie que ce qui passe, et pour TOUS les clubs : un exemplaire
      # casse ne doit pas partir dans la meme Release que les autres.
      - run: npm run verifier-tous

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Les notes et la liste des fichiers viennent du depot : un club
          # ajoute apparait dans la Release sans qu'on touche a ce fichier.
          npm run --silent notes-de-version > notes.md
          gh release create "$VERSION" \
            $(npm run --silent fichiers-livres | tr '\n' ' ') \
            --title "$VERSION" \
            --notes-file notes.md
